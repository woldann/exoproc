name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure npm registry auth for GitHub Packages
        run: |
          echo "@woldann:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach tarball to GitHub Release
        run: |
          npm pack --workspace=packages/exoproc
          TARBALL=$(ls woldann-exoproc-*.tgz exoproc-*.tgz 2>/dev/null | head -n 1)
          if [ -n "$TARBALL" ]; then
            VERSION=$(node -p "require('./packages/exoproc/package.json').version")
            TAG="@woldann/exoproc@$VERSION"
            echo "Uploading $TARBALL to release $TAG..."
            gh release upload "$TAG" "$TARBALL" --clobber || gh release upload "v$VERSION" "$TARBALL" --clobber || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
